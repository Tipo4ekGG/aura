<style>
:root{--red:#c8102e;--dark:#7a0a1c;--gold:#ffd23f;--ink:#111;--paper:#fff3d6}
*{box-sizing:border-box}
body{margin:0;color:var(--paper);font:16px/1.4 "Impact","Arial Black",system-ui,sans-serif;
background:radial-gradient(circle at 50% -10%,#e0213f 0,var(--red) 40%,var(--dark) 100%) fixed;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body:before{content:"★";position:fixed;right:-60px;top:40px;font-size:340px;color:rgba(255,210,63,.07);pointer-events:none;transform:rotate(15deg)}
main{max-width:540px;margin:0 auto;padding:14px;position:relative}
.top{text-align:center;color:var(--gold);letter-spacing:2px;font-size:13px}

.card.lead .crown{display:block}
.pn{color:var(--gold);font-size:18px;text-transform:uppercase}
.bal{font-size:46px;color:var(--paper);line-height:1.1}
.rank{font:700 12px system-ui,sans-serif;color:var(--gold);text-transform:uppercase;letter-spacing:1px;min-height:30px}
.mog{margin:12px 0 4px;text-align:center;font-size:13px;color:var(--gold);letter-spacing:1px}
.bar{height:22px;border:3px solid var(--gold);background:var(--ink);display:flex;border-radius:4px;overflow:hidden}

.btns{display:flex;gap:8px}
button{flex:1;padding:13px;border:0;border-radius:4px;font:inherit;font-size:16px;text-transform:uppercase;cursor:pointer;color:var(--ink)}
button:disabled{opacity:.5}
.plus{background:var(--gold)}.minus{background:#ff5470}
h2{font-size:15px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;border-bottom:2px solid var(--gold)}

#pop.on{display:flex;animation:in .25s}
@keyframes in{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
.pb{background:var(--ink);border:5px solid var(--gold);padding:22px 18px;text-align:center;max-width:380px;border-radius:6px}
.pb .arrow{font-size:80px;line-height:1}
.pb .big{font-size:38px;line-height:1.05;margin:4px 0}

#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:10;width:44px;flex:none;padding:6px;background:var(--ink);color:var(--gold);border:2px solid var(--gold);font-size:20px;border-radius:4px}

.sp{margin-top:6px}
.sp svg{width:100%;height:34px;display:block;background:rgba(255,210,63,.06);border-radius:3px}

.ck{flex:none;width:18px;height:18px;margin-right:8px;accent-color:#ffd23f;padding:0}
#em{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(0,0,0,.65);padding:20px}

#em .pb{width:100%;max-width:380px}
#pushb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;z-index:10;width:44px;flex:none;padding:6px;background:var(--ink);color:var(--gold);border:2px solid var(--gold);font-size:20px;border-radius:4px}

<script>
const URL_="https://btvmezpdhhhmxraqirsc.supabase.co";
const KEY="sb_publishable_SDcUdvavnvnn9dtqYMbAXg_fZPyZ2rt";
const START=1000;
const NAMES={a:"Игорь",b:"Артем"};
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("na").textContent=NAMES.a;$("nb").textContent=NAMES.b;
$("to").innerHTML=`<option value="a">${NAMES.a}</option><option value="b">${NAMES.b}</option>`;

function rank(v){
  if(v>=1500)return"🗿 ГИГАЧАД ТРУДА";
  if(v>=1150)return"Герой социального труда";
  if(v>=950)return"Рядовой гражданин";
  if(v>=700)return"Рисовый паёк сокращён";
  return"Отряд низких кредитов";
}
function showErr(t){const e=$("err");e.textContent=t||"";e.hidden=!t}

/* ---- ЗВУКИ (синтез через Web Audio, файлы не нужны) ---- */
let ctx=null,lastLead=null,soundOn=true;
try{soundOn=localStorage.getItem("snd")!=="0"}catch(e){}
function actx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!ctx)ctx=new AC();
  if(ctx.state==="suspended")ctx.resume();
  return ctx;
}
function tone(f,t0,d,type,vol,fEnd){
  const c=ctx,s=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,s);
  if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,s+d);
  g.gain.setValueAtTime(0.0001,s);
  g.gain.exponentialRampToValueAtTime(vol,s+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,s+d);
  o.connect(g);g.connect(c.destination);
  o.start(s);o.stop(s+d+0.05);
}
function sfx(kind){
  if(!soundOn)return;
  if(kind==="mog"&&(!ctx||ctx.state!=="running"))return;
  if(!actx())return;
  try{
    if(kind==="up"){            // торжественная фанфара на пентатонике
      [523,587,659,784,880,1047].forEach((f,i)=>tone(f,i*0.09,0.28,"square",0.12));
      [523,659,784,1047].forEach(f=>tone(f,0.6,0.7,"triangle",0.14));
    }else if(kind==="down"){    // «не делай так больше»: гонг и падающий баззер
      tone(110,0,1.1,"sine",0.35);
      tone(220,0,0.9,"triangle",0.15);
      tone(440,0.05,0.5,"sawtooth",0.12,90);
      tone(330,0.55,0.5,"sawtooth",0.12,70);
    }else if(kind==="mog"){     // бас-дроп: лидер сменился
      tone(140,0,0.8,"sine",0.45,40);
      tone(70,0.05,0.9,"sine",0.4,30);
    }else if(kind==="tick"){
      tone(900,0,0.05,"square",0.06);
    }
  }catch(e){}
}
function updSnd(){$("snd").textContent=soundOn?"🔊":"🔇"}
$("snd").onclick=()=>{
  soundOn=!soundOn;
  try{localStorage.setItem("snd",soundOn?"1":"0")}catch(e){}
  updSnd();
  if(soundOn)sfx("tick");
};
updSnd();

function pop(sign,n,name){
  const up=sign>0;
  sfx(up?"up":"down");
  $("pb").className="pb "+(up?"up":"dn");
  $("pb").innerHTML=up
   ?`<div class="arrow">⬆</div><div class="big">+${n} 社会信用</div><div class="zh2">好工作!</div><div class="sm">${esc(name)}: Хорошая работа. Партия довольна. 🗿</div>`
   :`<div class="arrow">⬇</div><div class="big">−${n} 社会信用</div><div class="zh2">不要再这样做!</div><div class="sm">${esc(name)}: НЕ ДЕЛАЙ ТАК БОЛЬШЕ! Рисовый паёк сокращён.</div>`;
  $("pop").classList.add("on");
  setTimeout(()=>$("pop").classList.remove("on"),1800);
}
$("pop").onclick=()=>$("pop").classList.remove("on");

async function load(){
  try{
    const r=await fetch(URL_+"/rest/v1/events?select=*&order=created_at.asc&limit=1000",{headers:H});
    if(!r.ok)throw new Error(r.status);
    const ev=await r.json();
    showErr("");
    const sum=k=>START+ev.filter(e=>e.to_player===k).reduce((s,e)=>s+e.amount,0);
    const a=sum("a"),b=sum("b");
    $("ba").textContent=a;$("bb").textContent=b;
    $("ra").textContent=rank(a);$("rb").textContent=rank(b);
    const total=Math.max(a,0)+Math.max(b,0)||1;
    const pa=Math.round(Math.max(a,0)/total*100);
    $("bara").style.width=pa+"%";$("barb").style.width=(100-pa)+"%";
    $("ca").classList.toggle("lead",a>b);$("cb").classList.toggle("lead",b>a);
    const lead=a>b?"a":b>a?"b":"";
    if(lastLead!==null&&lead&&lead!==lastLead)sfx("mog");
    lastLead=lead;
    const d=Math.abs(a-b);
    $("verdict").textContent=a===b?"Ничья. Партия наблюдает.":mogLine(a>b?NAMES.a:NAMES.b,a>b?NAMES.b:NAMES.a,d);
    EV=ev;renderLog();renderSpark(ev);
  }catch(e){showErr("Не удалось загрузить данные. Проверь интернет и таблицу events в Supabase.")}
}

/* ---- MOG-фразы ---- */
function mogLine(W,L,d){
  const v=d%3;
  if(v===0)return `${W} MOGнул ${L} на ${d}`;
  if(v===1)return `${L} mogged by ${W} на ${d}`;
  return `${W} mog ${L} на ${d}`;
}

/* ---- Мини-графики ---- */
function spark(k,ev){
  let v=START;const pts=[v];
  ev.forEach(e=>{if(e.to_player===k){v+=e.amount;pts.push(v)}});
  const mx=Math.max(...pts),mn=Math.min(...pts);
  const lo=Math.min(mn,START),hi=Math.max(mx,START),rg=(hi-lo)||1;
  const Y=p=>(26-((p-lo)/rg)*22).toFixed(1);
  const line=pts.length>1?pts.map((p,i)=>(i/(pts.length-1)*96+2).toFixed(1)+","+Y(p)).join(" "):"2,"+Y(START)+" 98,"+Y(START);
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><line x1="0" x2="100" y1="${Y(START)}" y2="${Y(START)}" stroke="#ffd23f" stroke-opacity=".4" stroke-dasharray="2 2" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline points="${line}" fill="none" stroke="${last>=START?"#ffd23f":"#ff5470"}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="spt"><span>▲ ${mx}</span><span>▼ ${mn}</span></div>`;
}
function renderSpark(ev){$("sa").innerHTML=spark("a",ev);$("sb").innerHTML=spark("b",ev)}

/* ---- История: выбор, правка, удаление ---- */
let EV=[],selMode=false,editId=null;
const sel=new Set();
const NEED_SQL="Не получилось изменить историю. Выполни в Supabase SQL для update/delete (я написал его в чате).";
function renderLog(){
  [...sel].forEach(id=>{if(!EV.some(e=>e.id===id))sel.delete(id)});
  $("log").className="log"+(selMode?" selmode":"");
  $("log").innerHTML=EV.length?EV.slice().reverse().map(e=>`<li class="${e.amount>0?"pos":"neg"}${sel.has(e.id)?" sel":""}" data-id="${e.id}">${selMode?`<input type="checkbox" class="ck" ${sel.has(e.id)?"checked":""}>`:""}<div class="lt"><b>${esc(NAMES[e.to_player]||"?")}</b><small>${esc(e.reason||"без причины")} · ${new Date(e.created_at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</small></div><span class="amt">${e.amount>0?"+":"−"}${Math.abs(e.amount)}</span></li>`).join(""):'<div class="msg">Архив пуст. Граждане ведут себя образцово.</div>';
  $("tools").hidden=!selMode;
  $("selbtn").textContent=selMode?"✔ готово":"✎ выбрать";
  $("bedit").disabled=sel.size!==1;
  $("bdel").disabled=sel.size===0;
  $("bdel").textContent="🗑"+(sel.size?" "+sel.size:"");
}
function openEdit(){
  const e=EV.find(x=>x.id===[...sel][0]);
  if(!e)return;
  editId=e.id;
  $("e_to").value=e.to_player;
  $("e_sign").value=e.amount>0?"1":"-1";
  $("e_amt").value=Math.abs(e.amount);
  $("e_why").value=e.reason||"";
  $("em").classList.add("on");
}
async function saveEdit(){
  const n=Math.abs(parseInt($("e_amt").value,10));
  if(!n||n>1000)return;
  const body={to_player:$("e_to").value,amount:parseInt($("e_sign").value,10)*n,reason:$("e_why").value.trim()||null};
  try{
    const r=await fetch(URL_+"/rest/v1/events?id=eq."+editId,{method:"PATCH",headers:{...H,Prefer:"return=representation"},body:JSON.stringify(body)});
    const j=r.ok?await r.json():[];
    if(!r.ok||!j.length)throw new Error("denied");
    $("em").classList.remove("on");
    await load();
  }catch(e){alert(NEED_SQL)}
}
async function delSel(){
  if(!sel.size)return;
  if(!confirm("Удалить записей: "+sel.size+"? Баланс пересчитается."))return;
  try{
    const r=await fetch(URL_+"/rest/v1/events?id=in.("+[...sel].join(",")+")",{method:"DELETE",headers:{...H,Prefer:"return=representation"}});
    const j=r.ok?await r.json():[];
    if(!r.ok||!j.length)throw new Error("denied");
    sel.clear();
    await load();
  }catch(e){alert(NEED_SQL)}
}
$("e_to").innerHTML=$("to").innerHTML;
$("selbtn").onclick=()=>{selMode=!selMode;if(!selMode)sel.clear();renderLog()};
$("log").onclick=e=>{
  if(!selMode)return;
  const li=e.target.closest("li[data-id]");
  if(!li)return;
  const id=Number(li.dataset.id);
  sel.has(id)?sel.delete(id):sel.add(id);
  renderLog();
};
$("bedit").onclick=openEdit;
$("bdel").onclick=delSel;
$("e_ok").onclick=saveEdit;
$("e_no").onclick=()=>$("em").classList.remove("on");

/* ---- WEB PUSH ---- */
const VAPID_PUBLIC="BAz6jeYlF0tMwtVm0hPNWJXfT6AKRf9lYvbaC6MBOzzLXrQ-NP9HKTBKEXuQ7Jvn3eLrmGGRHvWex33vldpzCts";
function b64u(str){
  const pad="=".repeat((4-str.length%4)%4);
  const raw=atob((str+pad).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
const pushOk=()=>("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window);
async function curSub(){
  const reg=await navigator.serviceWorker.getRegistration();
  return reg?await reg.pushManager.getSubscription():null;
}
async function pushState(){
  try{
    if(!pushOk()){$("pushb").textContent="🔕";return}
    const sub=await curSub();
    $("pushb").textContent=(sub&&Notification.permission==="granted")?"🔔":"🔕";
  }catch(e){}
}
async function togglePush(){
  if(!pushOk()){
    alert("Уведомления не поддерживаются в этом режиме. На iPhone сначала добавь сайт на главный экран (Поделиться → На экран «Домой»), открой его оттуда и нажми 🔔 ещё раз.");
    return;
  }
  try{
    const existing=await curSub();
    if(existing&&Notification.permission==="granted"){
      await existing.unsubscribe();
      await pushState();
      return;
    }
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){alert("Разрешение на уведомления не выдано. Его можно включить в настройках браузера или телефона.");return}
    const reg=await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const r=await fetch(URL_+"/rest/v1/push_subs",{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth})});
    if(!r.ok&&r.status!==409)throw new Error("save "+r.status);
    await pushState();
    sfx("tick");
  }catch(e){
    alert("Не получилось включить уведомления. Проверь, что в Supabase создана таблица push_subs. Ошибка: "+(e&&e.message?e.message:e));
  }
}
$("pushb").onclick=togglePush;
pushState();

async function add(sign){
  const n=Math.abs(parseInt($("amt").value,10));
  if(!n||n>1000)return;
  const to=$("to").value;
  $("p").disabled=$("m").disabled=true;
  try{
    const r=await fetch(URL_+"/rest/v1/events",{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({to_player:to,amount:sign*n,reason:$("why").value.trim()||null})});
    if(!r.ok)throw new Error(r.status);
    $("why").value="";
    pop(sign,n,NAMES[to]);
    await load();
  }catch(e){showErr("Не получилось сохранить. Попробуй ещё раз.")}
  $("p").disabled=$("m").disabled=false;
}

document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{$("amt").value=b.dataset.v;sfx("tick")});
$("p").onclick=()=>add(1);
$("m").onclick=()=>add(-1);
load();
setInterval(load,5000);
</script>
