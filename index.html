<style>
:root{--red:#c8102e;--dark:#7a0a1c;--gold:#ffd23f;--ink:#111;--paper:#fff3d6}
*{box-sizing:border-box}
body{margin:0;color:var(--paper);font:16px/1.4 "Impact","Arial Black",system-ui,sans-serif;
background:radial-gradient(circle at 50% -10%,#e0213f 0,var(--red) 40%,var(--dark) 100%) fixed;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body:before{content:"★";position:fixed;right:-60px;top:40px;font-size:340px;color:rgba(255,210,63,.07);pointer-events:none;transform:rotate(15deg)}
main{max-width:540px;margin:0 auto;padding:14px;position:relative}
.top{text-align:center;color:var(--gold);letter-spacing:2px;font-size:13px}
h1{font-size:30px;text-transform:uppercase;text-align:center;margin:2px 0 4px;color:var(--gold);text-shadow:3px 3px 0 var(--ink);line-height:1.05}
.zh{text-align:center;font-size:20px;color:var(--paper);opacity:.9;margin-bottom:12px;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--ink);border:3px solid var(--gold);border-radius:6px;padding:12px 8px;text-align:center;position:relative}
.card.lead{box-shadow:0 0 0 3px var(--red),0 0 22px 4px var(--gold)}
.crown{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:26px;display:none}
.card.lead .crown{display:block}
.pn{color:var(--gold);font-size:18px;text-transform:uppercase}
.bal{font-size:46px;color:var(--paper);line-height:1.1}
.rank{font:700 12px system-ui,sans-serif;color:var(--gold);text-transform:uppercase;letter-spacing:1px;min-height:30px}
.mog{margin:12px 0 4px;text-align:center;font-size:13px;color:var(--gold);letter-spacing:1px}
.bar{height:22px;border:3px solid var(--gold);background:var(--ink);display:flex;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .6s}
.bar .ba{background:var(--gold)}.bar .bb{background:#ff5470}
.verdict{text-align:center;margin:6px 0 12px;font-size:18px;text-transform:uppercase;min-height:24px}
.form{background:var(--ink);border:3px solid var(--gold);border-radius:6px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;margin-bottom:8px}
select,input{flex:1;min-width:0;padding:10px;border-radius:4px;border:2px solid var(--gold);background:#222;color:var(--paper);font:16px system-ui,sans-serif}
.quick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.quick button{flex:1;min-width:52px;padding:8px 4px;background:#222;color:var(--gold);border:2px solid var(--gold);font-size:14px}
.btns{display:flex;gap:8px}
button{flex:1;padding:13px;border:0;border-radius:4px;font:inherit;font-size:16px;text-transform:uppercase;cursor:pointer;color:var(--ink)}
button:disabled{opacity:.5}
.plus{background:var(--gold)}.minus{background:#ff5470}
h2{font-size:15px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;border-bottom:2px solid var(--gold)}
.log{list-style:none;padding:0;margin:0}
.log li{background:rgba(0,0,0,.45);border-left:5px solid var(--gold);padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;font-family:system-ui,sans-serif}
.log li.neg{border-left-color:#ff5470}
.log small{display:block;opacity:.75}
.amt{font:800 20px Impact,"Arial Black",sans-serif;white-space:nowrap}
.pos .amt{color:var(--gold)}.neg .amt{color:#ff7a90}
.msg{text-align:center;opacity:.8;padding:16px;font-family:system-ui,sans-serif}
.foot{text-align:center;font-size:12px;color:var(--gold);opacity:.8;margin:18px 0 6px;letter-spacing:1px}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(0,0,0,.65);padding:20px}
#pop.on{display:flex;animation:in .25s}
@keyframes in{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
.pb{background:var(--ink);border:5px solid var(--gold);padding:22px 18px;text-align:center;max-width:380px;border-radius:6px}
.pb .arrow{font-size:80px;line-height:1}
.pb .big{font-size:38px;line-height:1.05;margin:4px 0}
.pb .zh2{font-size:22px;margin:4px 0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.pb .sm{font:14px system-ui,sans-serif;opacity:.9}
.up .arrow,.up .big{color:var(--gold)}.dn .arrow,.dn .big{color:#ff5470}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:10;width:44px;flex:none;padding:6px;background:var(--ink);color:var(--gold);border:2px solid var(--gold);font-size:20px;border-radius:4px}

.sp{margin-top:6px}
.sp svg{width:100%;height:34px;display:block;background:rgba(255,210,63,.06);border-radius:3px}
.spt{display:flex;justify-content:space-between;font:700 10px system-ui,sans-serif;color:var(--gold);opacity:.8;margin-top:2px}
.hh{display:flex;justify-content:space-between;align-items:center}
button.mini{flex:none;padding:3px 8px;font:11px system-ui,sans-serif;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:3px;text-transform:none;letter-spacing:0}
.tools{display:flex;gap:6px;margin-bottom:8px}
.tools[hidden]{display:none}
.log li .lt{flex:1}
.log.selmode li{cursor:pointer}
.log li.sel{outline:2px solid var(--gold);background:rgba(255,210,63,.15)}
.ck{flex:none;width:18px;height:18px;margin-right:8px;accent-color:#ffd23f;padding:0}
#em{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(0,0,0,.65);padding:20px}
#em.on{display:flex}
#em .pb{width:100%;max-width:380px}
#pushb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;z-index:10;width:44px;flex:none;padding:6px;background:var(--ink);color:var(--gold);border:2px solid var(--gold);font-size:20px;border-radius:4px}
.card.me{border-color:#ff5470}.card{cursor:pointer}
[hidden]{display:none!important}
.auth{background:var(--ink);border:3px solid var(--gold);border-radius:6px;padding:14px}
.auth input{width:100%;margin-bottom:8px;flex:none}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{background:#222;color:var(--gold);border:2px solid var(--gold)}
.tabs button.on{background:var(--gold);color:var(--ink)}
.aerr{color:#ff7a90;font:14px system-ui,sans-serif;min-height:20px;margin:4px 0 8px}
.whoami{text-align:center;color:var(--gold);font:13px system-ui,sans-serif;margin-bottom:10px}
.whoami a{text-decoration:underline;cursor:pointer}
.cards{grid-template-columns:1fr 1fr}
</style>

<body>
<button id="snd" title="Звук">🔊</button>
<button id="pushb" title="Уведомления">🔕</button>
<main>
<div class="top">★ ЦЕНТРАЛЬНЫЙ КОМИТЕТ АУРЫ ★</div>
<h1>Счётчик ауры</h1>
<div class="zh">社会信用 · 光荣属于党</div>

<section id="auth" class="auth" hidden>
  <div class="tabs"><button id="tl" class="on">Вход</button><button id="tr">Регистрация</button></div>
  <input id="lg" placeholder="Логин (латиница, цифры, _)" autocapitalize="none" autocorrect="off" autocomplete="username" maxlength="20">
  <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
  <div id="regf" hidden><input id="dn" placeholder="Имя в рейтинге (необязательно)" maxlength="20"><input id="inv" placeholder="Код приглашения" autocapitalize="none"></div>
  <div class="aerr" id="aerr"></div>
  <button class="plus" id="go">Войти</button>
</section>

<div id="app" hidden>
  <div class="whoami">Ты: <b id="meName"></b> · <a id="out">выйти</a></div>
  <div class="cards" id="players"></div>
  <div class="form">
    <div class="row"><select id="to"></select><input type="number" id="amt" min="1" max="1000" value="15" inputmode="numeric"></div>
    <div class="quick"><button data-v="5">5</button><button data-v="15">15</button><button data-v="50">50</button><button data-v="100">100</button><button data-v="1000">1000</button></div>
    <div class="row"><input type="text" id="why" placeholder="За что? (потерял ауру, mogged…)" maxlength="120"></div>
    <div class="btns"><button class="plus" id="p">+ Хорошая работа</button><button class="minus" id="m">− Плохой работа</button></div>
  </div>
  <h2 class="hh"><span>Архив партии</span><button class="mini" id="selbtn">✎ выбрать</button></h2>
  <div class="tools" id="tools" hidden><button class="mini" id="bedit">✎ изменить</button><button class="mini" id="bdel">🗑</button></div>
  <ul class="log" id="log"></ul>
  <div class="msg" id="err" hidden></div>
</div>
<div class="foot">每天早上说“党万岁”+5 · ГИГАЧАД ТРУДА · 🗿</div>
</main>

<div id="pop"><div class="pb" id="pb"></div></div>
<div id="em"><div class="pb">
  <div class="big" style="font-size:24px;color:var(--gold)">Исправить запись</div>
  <div class="row" style="margin-top:10px"><select id="e_to"></select><select id="e_sign"><option value="1">+</option><option value="-1">−</option></select><input type="number" id="e_amt" min="1" max="1000"></div>
  <div class="row"><input type="text" id="e_why" maxlength="120" placeholder="За что?"></div>
  <div class="btns"><button class="plus" id="e_ok">Сохранить</button><button class="minus" id="e_no">Отмена</button></div>
</div></div>

<script>
const URL_="https://btvmezpdhhhmxraqirsc.supabase.co";
const KEY="sb_publishable_SDcUdvavnvnn9dtqYMbAXg_fZPyZ2rt";
const MAILDOM="example.com"; // служебный домен для логинов; если Supabase ругнётся на адрес — см. инструкцию
const START=1000;
const sb=supabase.createClient(URL_,KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me=null,profs=[],bals={},EV=[],mode="login",selMode=false,editId=null,timer=null;
const sel=new Set();
const nm=id=>{const p=profs.find(x=>x.id===id);return p?(p.display_name||p.username):"?"};
function showErr(t){const e=$("err");e.textContent=t||"";e.hidden=!t}
function rank(v){
  if(v>=1500)return"🗿 ГИГАЧАД ТРУДА";
  if(v>=1150)return"Герой социального труда";
  if(v>=950)return"Рядовой гражданин";
  if(v>=700)return"Рисовый паёк сокращён";
  return"Отряд низких кредитов";
}

const VAPID_PUBLIC="BAz6jeYlF0tMwtVm0hPNWJXfT6AKRf9lYvbaC6MBOzzLXrQ-NP9HKTBKEXuQ7Jvn3eLrmGGRHvWex33vldpzCts";
function spark(k,ev){
  let v=START;const pts=[v];
  ev.forEach(e=>{if(e.target===k){v+=e.amount;pts.push(v)}});
  const mx=Math.max(...pts),mn=Math.min(...pts);
  const lo=Math.min(mn,START),hi=Math.max(mx,START),rg=(hi-lo)||1;
  const Y=p=>(26-((p-lo)/rg)*22).toFixed(1);
  const line=pts.length>1?pts.map((p,i)=>(i/(pts.length-1)*96+2).toFixed(1)+","+Y(p)).join(" "):"2,"+Y(START)+" 98,"+Y(START);
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><line x1="0" x2="100" y1="${Y(START)}" y2="${Y(START)}" stroke="#ffd23f" stroke-opacity=".4" stroke-dasharray="2 2" stroke-width="1" vector-effect="non-scaling-stroke"/><polyline points="${line}" fill="none" stroke="${last>=START?"#ffd23f":"#ff5470"}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="spt"><span>▲ ${mx}</span><span>▼ ${mn}</span></div>`;
}

function b64u(str){
  const pad="=".repeat((4-str.length%4)%4);
  const raw=atob((str+pad).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
const pushOk=()=>("serviceWorker" in navigator)&&("PushManager" in window)&&("Notification" in window);
async function curSub(){
  const reg=await navigator.serviceWorker.getRegistration();
  return reg?await reg.pushManager.getSubscription():null;
}
async function pushState(){
  try{
    if(!pushOk()){$("pushb").textContent="🔕";return}
    const sub=await curSub();
    $("pushb").textContent=(sub&&Notification.permission==="granted")?"🔔":"🔕";
  }catch(e){}
}

/* ---- ЗВУКИ (синтез через Web Audio, файлы не нужны) ---- */
let ctx=null,lastLead=null,soundOn=true;
try{soundOn=localStorage.getItem("snd")!=="0"}catch(e){}
function actx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!ctx)ctx=new AC();
  if(ctx.state==="suspended")ctx.resume();
  return ctx;
}
function tone(f,t0,d,type,vol,fEnd){
  const c=ctx,s=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,s);
  if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,s+d);
  g.gain.setValueAtTime(0.0001,s);
  g.gain.exponentialRampToValueAtTime(vol,s+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,s+d);
  o.connect(g);g.connect(c.destination);
  o.start(s);o.stop(s+d+0.05);
}
function sfx(kind){
  if(!soundOn)return;
  if(kind==="mog"&&(!ctx||ctx.state!=="running"))return;
  if(!actx())return;
  try{
    if(kind==="up"){            // торжественная фанфара на пентатонике
      [523,587,659,784,880,1047].forEach((f,i)=>tone(f,i*0.09,0.28,"square",0.12));
      [523,659,784,1047].forEach(f=>tone(f,0.6,0.7,"triangle",0.14));
    }else if(kind==="down"){    // «не делай так больше»: гонг и падающий баззер
      tone(110,0,1.1,"sine",0.35);
      tone(220,0,0.9,"triangle",0.15);
      tone(440,0.05,0.5,"sawtooth",0.12,90);
      tone(330,0.55,0.5,"sawtooth",0.12,70);
    }else if(kind==="mog"){     // бас-дроп: лидер сменился
      tone(140,0,0.8,"sine",0.45,40);
      tone(70,0.05,0.9,"sine",0.4,30);
    }else if(kind==="tick"){
      tone(900,0,0.05,"square",0.06);
    }
  }catch(e){}
}
function updSnd(){$("snd").textContent=soundOn?"🔊":"🔇"}
$("snd").onclick=()=>{
  soundOn=!soundOn;
  try{localStorage.setItem("snd",soundOn?"1":"0")}catch(e){}
  updSnd();
  if(soundOn)sfx("tick");
};
updSnd();


function pop(sign,n,name){
  const up=sign>0;
  sfx(up?"up":"down");
  $("pb").className="pb "+(up?"up":"dn");
  $("pb").innerHTML=up
   ?`<div class="arrow">⬆</div><div class="big">+${n} 社会信用</div><div class="zh2">好工作!</div><div class="sm">${esc(name)}: Хорошая работа. Партия довольна. 🗿</div>`
   :`<div class="arrow">⬇</div><div class="big">−${n} 社会信用</div><div class="zh2">不要再这样做!</div><div class="sm">${esc(name)}: НЕ ДЕЛАЙ ТАК БОЛЬШЕ! Рисовый паёк сокращён.</div>`;
  $("pop").classList.add("on");
  setTimeout(()=>$("pop").classList.remove("on"),1800);
}
$("pop").onclick=()=>$("pop").classList.remove("on");

/* ---- Вход / регистрация ---- */
function setMode(m){mode=m;$("tl").classList.toggle("on",m==="login");$("tr").classList.toggle("on",m==="reg");$("regf").hidden=m==="login";$("go").textContent=m==="login"?"Войти":"Зарегистрироваться";$("aerr").textContent=""}
function authErr(t){$("aerr").textContent=t}
async function go(){
  const u=$("lg").value.trim().toLowerCase(),p=$("pw").value;
  if(!/^[a-z0-9_]{3,20}$/.test(u))return authErr("Логин: 3-20 символов, латиница, цифры и _");
  if(p.length<6)return authErr("Пароль: минимум 6 символов");
  $("go").disabled=true;authErr("");
  const email=u+"@"+MAILDOM;
  const r=mode==="login"
    ?await sb.auth.signInWithPassword({email,password:p})
    :await sb.auth.signUp({email,password:p,options:{data:{username:u,display_name:$("dn").value.trim().slice(0,20),invite:$("inv").value.trim()}}});
  $("go").disabled=false;
  if(r.error){
    const m=(r.error.message||"").toLowerCase();
    authErr(m.includes("invalid login")?"Неверный логин или пароль"
      :m.includes("already")?"Такой логин уже занят"
      :m.includes("database error")?"Неверный код приглашения или логин уже занят"
      :m.includes("email")?"Supabase не принял служебный адрес (смени MAILDOM в коде): "+r.error.message
      :r.error.message);
    return;
  }
  if(!r.data.session)return authErr("В Supabase включено подтверждение почты. Выключи «Confirm email» в настройках Auth.");
  await boot();
}
async function logout(){
  try{const s=await curSub();if(s)await sb.from("push_subs").delete().eq("endpoint",s.endpoint)}catch(e){}
  await sb.auth.signOut();
  me=null;clearInterval(timer);timer=null;
  $("app").hidden=true;$("auth").hidden=false;pushState();
}

/* ---- Данные ---- */
async function fetchAll(table){
  let all=[],from=0;
  for(;;){
    const {data,error}=await sb.from(table).select("*").order("id",{ascending:true}).range(from,from+999);
    if(error)throw error;
    all=all.concat(data);
    if(data.length<1000)break;
    from+=1000;
  }
  return all;
}
async function load(){
  try{
    const [pr,ev,bl]=await Promise.all([sb.from("profiles").select("*"),fetchAll("aura_events"),sb.from("balances").select("*")]);
    if(pr.error)throw pr.error;if(bl.error)throw bl.error;
    profs=pr.data;EV=ev;bals=Object.fromEntries(bl.data.map(b=>[b.id,b.balance]));
    showErr("");renderAll();
  }catch(e){showErr("Не удалось загрузить данные. Проверь интернет и что SQL из auth-setup.sql выполнен.")}
}
const bal=id=>bals[id]??START;
function renderAll(){
  $("meName").textContent=nm(me);
  const list=profs.slice().sort((a,b)=>bal(b.id)-bal(a.id));
  const top=list.length>1&&bal(list[0].id)>bal(list[1].id)?list[0].id:null;
  $("players").innerHTML=list.map(p=>`<div class="card${p.id===top?" lead":""}${p.id===me?" me":""}" data-id="${p.id}"><span class="crown">👑</span><div class="pn">${esc(p.display_name||p.username)}${p.id===me?" (я)":""}</div><div class="bal">${bal(p.id)}</div><div class="rank">${rank(bal(p.id))}</div><div class="sp">${spark(p.id,EV)}</div></div>`).join("");
  const others=profs.filter(p=>p.id!==me).sort((a,b)=>nm(a.id).localeCompare(nm(b.id)));
  const opts=others.map(p=>`<option value="${p.id}">${esc(nm(p.id))}</option>`).join("")||'<option value="">пока нет других игроков</option>';
  const cur=$("to").value;
  $("to").innerHTML=opts;if(cur)$("to").value=cur;
  $("e_to").innerHTML=opts;
  renderLog();
}
function renderLog(){
  [...sel].forEach(id=>{if(!EV.some(e=>e.id===id&&e.author===me))sel.delete(id)});
  $("log").className="log"+(selMode?" selmode":"");
  $("log").innerHTML=EV.length?EV.slice().reverse().map(e=>{const own=e.author===me;return `<li class="${e.amount>0?"pos":"neg"}${sel.has(e.id)?" sel":""}" data-id="${e.id}" data-own="${own?1:0}">${selMode&&own?`<input type="checkbox" class="ck" ${sel.has(e.id)?"checked":""}>`:""}<div class="lt"><b>${esc(nm(e.author))} → ${esc(nm(e.target))}</b><small>${esc(e.reason||"без причины")} · ${new Date(e.created_at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</small></div><span class="amt">${e.amount>0?"+":"−"}${Math.abs(e.amount)}</span></li>`}).join(""):'<div class="msg">Архив пуст. Граждане ведут себя образцово.</div>';
  $("tools").hidden=!selMode;
  $("selbtn").textContent=selMode?"✔ готово":"✎ выбрать";
  $("bedit").disabled=sel.size!==1;$("bdel").disabled=sel.size===0;
  $("bdel").textContent="🗑"+(sel.size?" "+sel.size:"");
}

/* ---- Действия ---- */
async function add(sign){
  const n=Math.abs(parseInt($("amt").value,10)),to=$("to").value;
  if(!n||n>1000||!to)return;
  $("p").disabled=$("m").disabled=true;
  const {error}=await sb.from("aura_events").insert({author:me,target:to,amount:sign*n,reason:$("why").value.trim()||null});
  if(error)showErr("Не получилось сохранить. Попробуй ещё раз.");
  else{$("why").value="";pop(sign,n,nm(to));await load()}
  $("p").disabled=$("m").disabled=false;
}
function openEdit(){
  const e=EV.find(x=>x.id===[...sel][0]);if(!e)return;
  editId=e.id;$("e_to").value=e.target;$("e_sign").value=e.amount>0?"1":"-1";
  $("e_amt").value=Math.abs(e.amount);$("e_why").value=e.reason||"";$("em").classList.add("on");
}
async function saveEdit(){
  const n=Math.abs(parseInt($("e_amt").value,10));if(!n||n>1000)return;
  const {data,error}=await sb.from("aura_events").update({target:$("e_to").value,amount:parseInt($("e_sign").value,10)*n,reason:$("e_why").value.trim()||null}).eq("id",editId).select();
  if(error||!data||!data.length)return alert("Не получилось изменить запись. Менять можно только свои.");
  $("em").classList.remove("on");await load();
}
async function delSel(){
  if(!sel.size||!confirm("Удалить записей: "+sel.size+"? Баланс пересчитается."))return;
  const {data,error}=await sb.from("aura_events").delete().in("id",[...sel]).select();
  if(error||!data||!data.length)return alert("Не получилось удалить. Удалять можно только свои записи.");
  sel.clear();await load();
}

/* ---- Уведомления ---- */
async function bindSub(sub){
  const j=sub.toJSON();
  return sb.rpc("register_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
}
async function togglePush(){
  if(!me){alert("Сначала войди в аккаунт.");return}
  if(!pushOk()){alert("Уведомления не поддерживаются в этом режиме. На iPhone сначала добавь сайт на главный экран (Поделиться → На экран «Домой»), открой его оттуда и нажми 🔔 ещё раз.");return}
  try{
    const existing=await curSub();
    if(existing&&Notification.permission==="granted"){
      await sb.from("push_subs").delete().eq("endpoint",existing.endpoint);
      await existing.unsubscribe();await pushState();return;
    }
    if(await Notification.requestPermission()!=="granted"){alert("Разрешение на уведомления не выдано. Его можно включить в настройках телефона.");return}
    const reg=await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const {error}=await bindSub(sub);if(error)throw error;
    await pushState();sfx("tick");
  }catch(e){alert("Не получилось включить уведомления: "+(e&&e.message?e.message:e))}
}

/* ---- Запуск ---- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("auth").hidden=false;$("app").hidden=true;return}
  me=session.user.id;
  $("auth").hidden=true;$("app").hidden=false;
  await load();
  try{const s=await curSub();if(s&&Notification.permission==="granted")await bindSub(s)}catch(e){}
  pushState();
  if(!timer)timer=setInterval(()=>{if(me)load()},5000);
}
$("tl").onclick=()=>setMode("login");$("tr").onclick=()=>setMode("reg");
$("go").onclick=go;$("pw").onkeydown=e=>{if(e.key==="Enter")go()};
$("out").onclick=logout;
$("p").onclick=()=>add(1);$("m").onclick=()=>add(-1);
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{$("amt").value=b.dataset.v;sfx("tick")});
$("players").onclick=e=>{const c=e.target.closest(".card");if(c&&c.dataset.id!==me)$("to").value=c.dataset.id};
$("selbtn").onclick=()=>{selMode=!selMode;if(!selMode)sel.clear();renderLog()};
$("log").onclick=e=>{
  if(!selMode)return;
  const li=e.target.closest("li[data-id]");if(!li||li.dataset.own!=="1")return;
  const id=Number(li.dataset.id);sel.has(id)?sel.delete(id):sel.add(id);renderLog();
};
$("bedit").onclick=openEdit;$("bdel").onclick=delSel;$("e_ok").onclick=saveEdit;$("e_no").onclick=()=>$("em").classList.remove("on");
$("pushb").onclick=togglePush;
boot();
</script>
</body>
</html>
